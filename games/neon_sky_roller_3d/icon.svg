<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0a0515"/>
    </radialGradient>
    <radialGradient id="sphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f6ff"/>
      <stop offset="70%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#001a66"/>
    </radialGradient>
    <linearGradient id="slice1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#aa0044"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <ellipse cx="256" cy="360" rx="180" ry="40" fill="url(#slice1)" filter="url(#glow)"/>
  <ellipse cx="256" cy="330" rx="140" ry="32" fill="#111118"/>
  <circle cx="256" cy="200" r="80" fill="url(#sphere)" filter="url(#glow)"/>
</svg>
